    <div class="container text-center my-4">
        <div class="row align-items-stretch"> 
            

            <div class="col-md-4 mb-4">
                <div class="card bg-dark text-white h-100">
                        <img src="imgtienda/Midnight_Club-Los_Angeles.jpg" class="card-img-top img-juego" alt="Midnight Club">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="card-title">Midnight club</h5>
                                <p class="card-text">$ 15000 CLP</p>
                            </div>
                            <button onclick="agregarAlCarrito('Midnight club', 15000, 'imgtienda/Midnight_Club-Los_Angeles.jpg')" class="btn btn-primary w-100 mt-3">Agregar al carrito</button>
                        </div>
                    </div>
                </div>


                <div class="col-md-4 mb-4">
                    <div class="card bg-dark text-white h-100">
                        <img src="imgtienda/fifastreet.jpg" class="card-img-top img-juego" alt="Fifa Street 2">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="card-title">Fifa street 2</h5>
                                <p class="card-text">$ 10000 CLP</p>
                            </div>
                            <button onclick="agregarAlCarrito('Fifa street 2', 10000, 'imgtienda/fifastreet.jpg')" class="btn btn-primary w-100 mt-3">Agregar al carrito</button>

                <div class="col-md-4 mb-4">
                    <div class="card bg-dark text-white h-100">
                        <img src="imgtienda/black.jpg" class="card-img-top img-juego" alt="Black">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="card-title">Black</h5>
                                <p class="card-text">$ 5000 CLP</p>
                            </div>
                            <button onclick="agregarAlCarrito('Black', 5000, 'imgtienda/black.jpg')" class="btn btn-primary w-100 mt-3">Agregar al carrito</button>
                        </div>
                    </div>
                </div>

                <script>
                    function agregarAlCarrito(nombre, precio, imagen) {
                        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
                        let juegoExistente = carrito.find(producto => producto.nombre === nombre);
                        if (juegoExistente) {
                            juegoExistente.cantidad += 1;
                        } else {
                            carrito.push({
                                nombre: nombre,
                                precio: precio,
                                imagen: imagen,
                                cantidad: 1
                            });
                        }
                        localStorage.setItem('carrito', JSON.stringify(carrito));
                        alert(`¡${nombre} se agregó al carrito!`);
                    }
                </script>
