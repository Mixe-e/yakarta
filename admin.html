<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .nav-tabs .nav-link {
            color: #b0b0b0;
            border-color: #333;
        }
        .nav-tabs .nav-link.active {
            background-color: #0d6efd;
            color: #ffffff !important;
            border-color: #0d6efd;
        }
        .table-dark {
            --bs-table-bg: #1e1e1e;
        }
    </style>
</head>

<body>


    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="index.html">
                <i class="bi bi-shield-lock-fill me-2"></i>Panel Administrador
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-house-door me-1"></i> Ir a la Tienda
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Gestión del Sistema</h2>

        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="productos-tab" data-bs-toggle="tab" data-bs-target="#productos" type="button" role="tab">
                    <i class="bi bi-controller me-2"></i>Productos
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="usuarios-tab" data-bs-toggle="tab" data-bs-target="#usuarios" type="button" role="tab">
                    <i class="bi bi-people me-2"></i>Usuarios
                </button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabsContent">



                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Inventario de Productos</h4>

                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalProducto" onclick="prepararCrearProducto()">
                        <i class="bi bi-plus-lg me-1"></i> Nuevo Producto
                    </button>
                </div>


                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle border-secondary">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductos">

                        </tbody>
                    </table>
                </div>
            </div>


            <div class="tab-pane fade" id="usuarios" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Lista de Usuarios</h4>
                    
                    <button class="btn btn-warning text-dark fw-bold" data-bs-toggle="modal" data-bs-target="#modalUsuario" onclick="prepararCrearUsuario()">
                        <i class="bi bi-person-plus-fill me-1"></i> Nuevo Usuario
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle border-secondary">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios">

                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>




    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="tituloModalProducto">Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formProducto">
                        <input type="hidden" id="prodIndex">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Juego</label>
                            <input type="text" id="prodNombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio ($ CLP)</label>
                            <input type="number" id="prodPrecio" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ruta de Imagen</label>
                            <input type="text" id="prodImagen" class="form-control" placeholder="imgtienda/juego.jpg" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-3">Guardar Producto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>




    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="tituloModalUsuario">Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formUsuario">
                        <input type="hidden" id="userIndex">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" id="userNombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="userEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol</label>
                            <select id="userRol" class="form-select">
                                <option value="Cliente">Cliente</option>
                                <option value="Administrador">Administrador</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-warning text-dark fw-bold w-100 mt-3">Guardar Usuario</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
        
    </script>
    <script src="js/admin.js"></script>

</body>
</html>
