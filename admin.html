<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .nav-tabs .nav-link {
            color: #b0b0b0;
            border-color: #333;
        }
        .nav-tabs .nav-link.active {
            background-color: #0d6efd;
            color: #ffffff !important;
            border-color: #0d6efd;
        }
        .table-dark {
            --bs-table-bg: #1e1e1e;
        }
    </style>
</head>

<body>


    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="index.html">
                <i class="bi bi-shield-lock-fill me-2"></i>Panel Administrador
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-house-door me-1"></i> Ir a la Tienda
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Gestión del Sistema</h2>

        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="productos-tab" data-bs-toggle="tab" data-bs-target="#productos" type="button" role="tab">
                    <i class="bi bi-controller me-2"></i>Productos
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="usuarios-tab" data-bs-toggle="tab" data-bs-target="#usuarios" type="button" role="tab">
                    <i class="bi bi-people me-2"></i>Usuarios
                </button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabsContent">



                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Inventario de Productos</h4>

                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalProducto" onclick="prepararCrearProducto()">
                        <i class="bi bi-plus-lg me-1"></i> Nuevo Producto
                    </button>
                </div>


                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle border-secondary">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductos">

                        </tbody>
                    </table>
                </div>
            </div>


            <div class="tab-pane fade" id="usuarios" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Lista de Usuarios</h4>

                    <button class="btn btn-warning text-dark fw-bold" data-bs-toggle="modal" data-bs-target="#modalUsuario" onclick="prepararCrearUsuario()">
                        <i class="bi bi-person-plus-fill me-1"></i> Nuevo Usuario
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle border-secondary">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios">

                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>




    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="tituloModalProducto">Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formProducto">
                        <input type="hidden" id="prodIndex">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Juego</label>
                            <input type="text" id="prodNombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio ($ CLP)</label>
                            <input type="number" id="prodPrecio" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ruta de Imagen</label>
                            <input type="text" id="prodImagen" class="form-control" placeholder="imgtienda/juego.jpg" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-3">Guardar Producto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>




    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="tituloModalUsuario">Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formUsuario">
                        <input type="hidden" id="userIndex">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" id="userNombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="userEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol</label>
                            <select id="userRol" class="form-select">
                                <option value="Cliente">Cliente</option>
                                <option value="Administrador">Administrador</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-warning text-dark fw-bold w-100 mt-3">Guardar Usuario</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        let productos = JSON.parse(localStorage.getItem('productosAdmin')) || [
            { nombre: "Midnight club", precio: 15000, imagen: "imgtienda/Midnight_Club-Los_Angeles.jpg" },
            { nombre: "Fifa street 2", precio: 10000, imagen: "imgtienda/fifastreet.jpg" },
            { nombre: "Black", precio: 5000, imagen: "imgtienda/black.jpg" }
        ];



        let usuarios = JSON.parse(localStorage.getItem('usuariosAdmin')) || [
            { nombre: "mixin", email: "mixin@admin.com", rol: "Administrador" },
            { nombre: "Juanito escarcha", email: "juan@gmail.com", rol: "Cliente" }
        ];

        const modalProductoBS = new bootstrap.Modal(document.getElementById('modalProducto'));
        const modalUsuarioBS = new bootstrap.Modal(document.getElementById('modalUsuario'));

        document.addEventListener('DOMContentLoaded', () => {
            guardarYRenderizarProductos();
            guardarYRenderizarUsuarios();
        });


        function guardarYRenderizarProductos() {
            localStorage.setItem('productosTienda', JSON.stringify(productos));
            
            const tabla = document.getElementById('tablaProductos');
            tabla.innerHTML = '';

            productos.forEach((p, index) => {
                tabla.innerHTML += `
                    <tr>
                        <td><img src="${p.imagen}" style="width: 40px; height: 50px; object-fit: cover;" class="rounded"></td>
                        <td>${p.nombre}</td>
                        <td>$ ${p.precio.toLocaleString('es-CL')} CLP</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-warning me-1" onclick="editarProducto(${index})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarProducto(${index})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `;
        });
        }

        
        function prepararCrearProducto() {
            document.getElementById('tituloModalProducto').textContent = 'Nuevo Producto';
            document.getElementById('prodIndex').value = '';
            document.getElementById('formProducto').reset();
        }

        function editarProducto(index) {
            document.getElementById('tituloModalProducto').textContent = 'Editar Producto';
            document.getElementById('prodIndex').value = index;
            document.getElementById('prodNombre').value = productos[index].nombre;
            document.getElementById('prodPrecio').value = productos[index].precio;
            document.getElementById('prodImagen').value = productos[index].imagen;
            modalProductoBS.show();
        }

        document.getElementById('formProducto').addEventListener('submit', (e) => {
            e.preventDefault();
            const idx = document.getElementById('prodIndex').value;
            const nuevo = {
                nombre: document.getElementById('prodNombre').value,
                precio: Number(document.getElementById('prodPrecio').value),
                imagen: document.getElementById('prodImagen').value
            };

            if (idx === '') {
                productos.push(nuevo); 
            } else {
                productos[idx] = nuevo; 
            }

            guardarYRenderizarProductos();
            modalProductoBS.hide();
        });

        function eliminarProducto(index) {
            if (confirm("¿Estás seguro de eliminar este producto?")) {
                productos.splice(index, 1);
                guardarYRenderizarProductos();
            }
        }


        function guardarYRenderizarUsuarios() {
            localStorage.setItem('usuariosAdmin', JSON.stringify(usuarios));
            const tabla = document.getElementById('tablaUsuarios');
            tabla.innerHTML = '';

            usuarios.forEach((u, index) => {
                tabla.innerHTML += `
                    <tr>
                        <td>${u.nombre}</td>
                        <td>${u.email}</td>
                        <td><span class="badge ${u.rol === 'Administrador' ? 'bg-danger' : 'bg-info'}">${u.rol}</span></td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-warning me-1" onclick="editarUsuario(${index})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarUsuario(${index})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function prepararCrearUsuario() {
            document.getElementById('tituloModalUsuario').textContent = 'Nuevo Usuario';
            document.getElementById('userIndex').value = '';
            document.getElementById('formUsuario').reset();
        }

        function editarUsuario(index) {
            document.getElementById('tituloModalUsuario').textContent = 'Editar Usuario';
            document.getElementById('userIndex').value = index;
            document.getElementById('userNombre').value = usuarios[index].nombre;
            document.getElementById('userEmail').value = usuarios[index].email;
            document.getElementById('userRol').value = usuarios[index].rol;
            modalUsuarioBS.show();
        }

        document.getElementById('formUsuario').addEventListener('submit', (e) => {
            e.preventDefault();
            const idx = document.getElementById('userIndex').value;
            const nuevo = {
                nombre: document.getElementById('userNombre').value,
                email: document.getElementById('userEmail').value,
                rol: document.getElementById('userRol').value
            };

            if (idx === '') {
                usuarios.push(nuevo); 
            } else {
                usuarios[idx] = nuevo; 
            }

            guardarYRenderizarUsuarios();
            modalUsuarioBS.hide();
        });

        function eliminarUsuario(index) {
            if (confirm("¿Estás seguro de eliminar este usuario?")) {
                usuarios.splice(index, 1);
                guardarYRenderizarUsuarios();
            }
        }
    </script>
</body>
</html>
