  <h5>Gmail: Mcyakartalovin@solab.cl</h5>

<section class="bloqueContacto izquierda">
  <h2>Quieres trabajar con nosotros? <br> <b>Deja tus datos aqui:</b></h2>

  <form id="formulario" class="formularioContacto">
    <div class="mb-3">
      <label for="gmail" class="form-label">Gmail</label>
      <input type="email" class="form-control" id="gmail" maxlength="100" pattern=".+@(gmail\.com|duoc\.cl|profesor\.duoc\.cl)$" required placeholder="name@example.com">
      <div id="maximo" class="form-text">gmail.com \ duoc.cl \ profesor.duoc.cl</div>
    </div>

    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" required id="nombre">
    </div>

    <div class="mb-3">
      <label for="telefono" class="form-label">Telefono</label>
      <input type="number" class="form-control" minlength="1" maxlength="9" required id="telefono">
    </div>

    <div class="mb-3">
      <label for="comentario" class="form-label">Comentario</label>
      <textarea class="form-control" id="comentario" rows="3"></textarea>
    </div>

    <button id="botonpress" type="submit" class="btn btn-primary">Confirmar</button>
  </form>
</section>

<script>
  const formulario = document.getElementById('formulario');

  formulario.addEventListener('submit', function(event) {
    event.preventDefault();

    const email = document.getElementById('gmail').value;
    const nombre = document.getElementById('nombre').value;
    const telefono = document.getElementById('telefono').value;

    alert(`¡Información enviada correctamente!\n\nDatos registrados:\n- Nombre: ${nombre}\n- Correo: ${email}\n- Telefono: ${telefono}`);

    formulario.reset();
  });
</script>
