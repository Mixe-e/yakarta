    <div class="row g-3 align-items-center">
      <div class="col-auto">
  <label style="color: white;" for="gmail" class="form-label">Gmail</label>

  <div class="col-auto">
  <label style="color: white;" for="nombre"  class="form-label" >Nombre</label>

    Debe tener entre 4 a 10 caracteres

</div>

  <div class="row g-3 align-items-center">
