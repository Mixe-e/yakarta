<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Direccion</title>
    <link rel="icon" type="image/png" href="img/logofeoyakarta.png">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 text-white"> 


















    

    <div class="card bg-secondary text-white p-4 shadow-lg" style="max-width: 500px; width: 100%;">
        <h3 class="mb-4 text-center">Datos de Despacho</h3>

        <form id="formDireccion">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" id="nombre" required placeholder="Ej: Cristian Orlando">
            </div>

            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección de Calle y Número</label>
                <input type="text" class="form-control" id="direccion" required placeholder="Ej: Av. Pudahuel 800">
            </div>

            <div class="mb-3">
                <label for="comuna" class="form-label">Ciudad / Comuna</label>
                <input type="text" class="form-control" id="comuna" required placeholder="Ej: Santiago">
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono de Contacto</label>
                <input type="tel" class="form-control" id="telefono" required placeholder="+56 9 1234 5678">
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary fw-bold">Enviar y Ver Resumen</button>
                <a href="carrito.html" class="btn btn-outline-light btn-sm">Volver al Carrito</a>
            </div>
        </form>
    </div>



    
    <script>
        document.getElementById('formDireccion').addEventListener('submit', function(e) {
            e.preventDefault();


            const datosEnvio = {
                nombre: document.getElementById('nombre').value.trim(),
                direccion: document.getElementById('direccion').value.trim(),
                comuna: document.getElementById('comuna').value.trim(),
                telefono: document.getElementById('telefono').value.trim()
            };


            localStorage.setItem('datosEnvio', JSON.stringify(datosEnvio));


            window.location.href = 'resumen.html';
        });
    </script>



</body>
</html>
