<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container my-5">
        <h2 class="mb-4">Tu Carrito de Compras</h2>

        <div class="row">

            <div class="col-md-8">
                <ul id="listaCarrito" class="list-group list-group-flush mb-4">

                </ul>
            </div>


            <div class="col-md-4">
                <div class="card bg-secondary text-white p-3">
                    <h4>Resumen</h4>
                    <hr>
                    <h5>Total: <span id="totalPagar">$ 0 CLP</span></h5>
                    <button class="btn btn-success w-100 mt-3">Proceder al Pago</button>
                    <button onclick="vaciarCarrito()" class="btn btn-outline-danger w-100 mt-2">Vaciar Carrito</button>
                    <a href="index.html" class="btn btn-link text-white text-center mt-2">Volver a la tienda</a>
                </div>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', cargarCarrito);

        function cargarCarrito() {
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            let listaContainer = document.getElementById('listaCarrito');
            let totalContainer = document.getElementById('totalPagar');

            listaContainer.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                listaContainer.innerHTML = '<li class="list-group-item bg-dark text-white border-secondary">El carrito está vacío.</li>';
                totalContainer.textContent = '$ 0 CLP';
                return;
            }

            carrito.forEach((producto, index) => {
                let subtotal = producto.precio * producto.cantidad;
                total += subtotal;

                listaContainer.innerHTML += `
                    <li class="list-group-item bg-dark text-white border-secondary d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <img src="${producto.imagen}" style="width: 50px; height: 60px; object-fit: cover;" class="me-3 rounded">
                            <div>
                                <h6 class="mb-0">${producto.nombre}</h6>
                                <small class="text-muted">Cantidad: ${producto.cantidad} x $${producto.precio} CLP</small>
                            </div>
                        </div>
                        <div>
                            <span class="me-3 fw-bold">$ ${subtotal} CLP</span>
                            <button onclick="eliminarProducto(${index})" class="btn btn-danger btn-sm">X</button>
                        </div>
                    </li>
                `;
            });

            totalContainer.textContent = `$ ${total} CLP`;
        }

        function eliminarProducto(index) {
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            carrito.splice(index, 1); 
            localStorage.setItem('carrito', JSON.stringify(carrito));
            cargarCarrito(); 
        }

        function vaciarCarrito() {
            localStorage.removeItem('carrito');
            cargarCarrito(); 
        }
    </script>
</body>
</html>
