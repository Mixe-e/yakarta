<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gaming Store</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/logofeoyakarta.png">

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .card-registro {
            background-color: #1e1e1e;
            border: 1px solid #333;
            max-width: 450px;
            margin: 50px auto;
        }
    </style>
</head>
<body>





    <div class="container">
        <div class="card card-registro p-4 rounded-3 shadow">
            <h3 class="text-center text-primary mb-4"><i class="bi bi-person-plus-fill me-2"></i>Crear Cuenta</h3>
            
            <form id="formRegistro">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="nombre" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control bg-dark text-white border-secondary" id="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary" id="password" placeholder="••••••••" required>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary" id="confirmPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Registrarse</button>

                <div class="text-center">
                    <span class="text-secondary small">¿Ya tienes una cuenta?</span>
                    <a href="logeo.html" class="text-info small fw-bold ms-1">Inicia Sesión aquí</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/autenticacion.js"></script>
    <script src="js/registrarse.js"></script>
</body>
</html>
