<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión </title>
    <link rel="icon" type="image/png" href="img/logofeoyakarta.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #121212;
            color: white;
        }
        .card-login {
            background-color: #1e1e1e;
            border-color: #333333;
            max-width: 420px;
            width: 100%;
        }
        .form-control {
            background-color: #2b2b2b;
            border-color: #444;
            color: white;
        }
        .form-control:focus {
            background-color: #333;
            color: white;
            border-color: #0d6efd;
            box-shadow: none;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card card-login p-4 shadow-lg rounded-3">

        <div class="text-center mb-4">
            <i class="bi bi-controller display-3 text-primary"></i>
            <h3 class="fw-bold mt-2">Iniciar Sesión</h3>
            <p class="text-secondary small">Ingresa tus credenciales para acceder</p>
        </div>

        <div id="alertError" class="alert alert-danger d-none py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span id="mensajeError">Correo o contraseña incorrectos.</span>
        </div>

        <form id="formLogin">
            <div class="mb-3">
                <label for="email" class="form-label text-start w-100">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-secondary text-white border-secondary"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label text-start w-100">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-secondary text-white border-secondary"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="recordar">
                    <label class="form-check-label small text-secondary" for="recordar">Recordarme</label>
                </div>
                <a href="#" class="small text-primary text-decoration-none">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
            </button>


            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1 border-secondary m-0">
                <span class="px-2 text-secondary small">¿No tienes una cuenta?</span>
                <hr class="flex-grow-1 border-secondary m-0">
            </div>


            <a href="registrarse.html" class="btn btn-outline-success w-100 fw-bold py-2 mb-3">
                <i class="bi bi-person-plus-fill me-1"></i> Crear Cuenta Nueva
            </a>

            <div class="text-center">
                <a href="index.html" class="text-secondary text-decoration-none small">
                    <i class="bi bi-arrow-left me-1"></i> Volver a la Tienda
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
