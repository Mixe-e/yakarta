<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">



    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">





        <div class="card-body">
            <h3 class="card-title text-center mb-4 text-primary">Iniciar Sesión</h3>

            <form id="loginForm" novalidate>

                <div class="mb-3">
                    <label for="username" class="form-label">Usuario o Correo</label>
                    <input type="text" class="form-length form-control" id="username" placeholder="Ingresa tu usuario" required>
                </div>


                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
                </div>


                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
                </div>
            </form>


            <div id="alertMessage" class="alert d-none mt-3 text-center" role="alert"></div>
        </div>
    </div>


    <script>
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const alertMessage = document.getElementById('alertMessage');


            const validUser = "holi";
            const validPassword = "tumamita123";


            alertMessage.classList.add('d-none');
            alertMessage.classList.remove('alert-success', 'alert-danger');


            if (!usernameInput || !passwordInput) {
                mostrarAlerta("Por favor, llena todos los campos.", "alert-danger");
                return;
            }


            if (usernameInput === validUser && passwordInput === validPassword) {
                mostrarAlerta("¡Inicio de sesión exitoso! Redirigiendo...", "alert-success");


                setTimeout(() => {
                    alert("Bienvenido al sistema");

                }, 1500);
            } else {
                mostrarAlerta("Usuario o contraseña incorrectos.", "alert-danger");
            }
        });

        function mostrarAlerta(mensaje, claseTipo) {
            const alertMessage = document.getElementById('alertMessage');
            alertMessage.textContent = mensaje;
            alertMessage.classList.add(claseTipo);
            alertMessage.classList.remove('d-none');
        }
    </script>




    <script src="script.js"></script>
</body>
</html>
